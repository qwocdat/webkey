<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ScamCheck Center</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Grid Navigation */
    .grid-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .menu-card:active {
      transform: scale(0.98);
      background: var(--card-hover);
    }

    .menu-card.active {
      border-color: var(--accent-color);
      background: rgba(59, 130, 246, 0.1);
    }

    .icon-svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent-color);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-card span {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Content Panels */
    .panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease-in-out;
    }

    .panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
    }

    /* Form Inputs & Buttons */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-control {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-color);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-submit:active {
      background: var(--accent-hover);
    }

    /* Result & Alert Boxes */
    .alert-box {
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success-color);
      color: #6ee7b7;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger-color);
      color: #fca5a5;
    }

    /* List Item View */
    .list-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item .item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .list-item .item-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat-card {
      background: var(--bg-color);
      padding: 12px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="header">
    <h1>ScamCheck Center</h1>
    <p>Hệ thống tra cứu & Cảnh báo lừa đảo tự động</p>
  </div>

  <!-- Navigation Grid (Clean SVG Icons - No Emojis) -->
  <div class="grid-menu">
    <div class="menu-card" onclick="openPanel('panel-check')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Kiểm tra Scam</span>
    </div>

    <div class="menu-card" onclick="openPanel('panel-report')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span>Gửi Báo Cáo</span>
    </div>

    <div class="menu-card" onclick="openPanel('panel-recent')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      <span>Báo Cáo Gần Đây</span>
    </div>

    <div class="menu-card" onclick="openPanel('panel-stats')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Thống Kê Chung</span>
    </div>
  </div>

  <!-- Panel 1: Tra cứu -->
  <div id="panel-check" class="panel">
    <div class="panel-title">
      <span>Tra cứu thông tin</span>
      <button class="btn-close" onclick="closePanel('panel-check')">Đóng [x]</button>
    </div>
    <div class="form-group">
      <label>SĐT / STK / Link / Social / Tên</label>
      <input type="text" id="check-input" class="form-control" placeholder="Nhập thông tin cần tra..." />
    </div>
    <button class="btn-submit" onclick="executeCheck()">Tra Cứu Ngay</button>
    <div id="check-result" style="margin-top: 14px;"></div>
  </div>

  <!-- Panel 2: Gửi Báo Cáo -->
  <div id="panel-report" class="panel">
    <div class="panel-title">
      <span>Tạo báo cáo lừa đảo</span>
      <button class="btn-close" onclick="closePanel('panel-report')">Đóng [x]</button>
    </div>
    <div class="form-group">
      <label>Loại đối tượng</label>
      <select id="report-type" class="form-control">
        <option value="phone">Số điện thoại</option>
        <option value="bank">Tài khoản ngân hàng</option>
        <option value="link">Đường dẫn Website</option>
        <option value="social">Tài khoản Social (TikTok/Tele/Zalo/YT)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Thông tin đối tượng</label>
      <input type="text" id="report-value" class="form-control" placeholder="Ví dụ: 0989xxx hoặc MBBank-0989xxx" />
    </div>
    <div class="form-group">
      <label>Chi tiết hành vi</label>
      <textarea id="report-desc" class="form-control" placeholder="Mô tả lại sự việc lừa đảo..."></textarea>
    </div>
    <button class="btn-submit" onclick="submitReport()">Gửi Báo Cáo</button>
  </div>

  <!-- Panel 3: Báo Cáo Gần Đây -->
  <div id="panel-recent" class="panel">
    <div class="panel-title">
      <span>Báo cáo mới cập nhật</span>
      <button class="btn-close" onclick="closePanel('panel-recent')">Đóng [x]</button>
    </div>
    <div id="recent-list">
      <div class="alert-box alert-success">Đã tải dữ liệu mới nhất từ CSDL.</div>
    </div>
  </div>

  <!-- Panel 4: Thống Kê -->
  <div id="panel-stats" class="panel">
    <div class="panel-title">
      <span>Thống kê hệ thống</span>
      <button class="btn-close" onclick="closePanel('panel-stats')">Đóng [x]</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-blacklist">1,280</div>
        <div class="stat-label">Blacklist</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-reports">3,450</div>
        <div class="stat-label">Báo Cáo</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-checks">18,920</div>
        <div class="stat-label">Lượt Tra</div>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function openPanel(panelId) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
    }

    function closePanel(panelId) {
      document.getElementById(panelId).classList.remove('active');
    }

    function executeCheck() {
      const input = document.getElementById('check-input').value.trim();
      const resultDiv = document.getElementById('check-result');

      if (!input) {
        resultDiv.innerHTML = `<div class="alert-box alert-danger">Vui lòng nhập thông tin cần tra cứu.</div>`;
        return;
      }

      resultDiv.innerHTML = `<div class="alert-box alert-success">Đang xử lý kết quả cho: <b>${input}</b>...</div>`;
      
      // Tích hợp API Backend của bạn ở đây
    }

    function submitReport() {
      const val = document.getElementById('report-value').value.trim();
      const desc = document.getElementById('report-desc').value.trim();

      if (!val || !desc) {
        alert('Vui lòng nhập đầy đủ thông tin báo cáo.');
        return;
      }

      alert('Báo cáo của bạn đã được gửi tới Quản trị viên kiểm duyệt.');
      closePanel('panel-report');
    }
  </script>
</body>
</html>
