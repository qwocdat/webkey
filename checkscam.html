<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ScamCheck Center</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .grid-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .menu-card:active {
      transform: scale(0.98);
      background: var(--card-hover);
    }

    .icon-svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent-color);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-card span {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease-in-out;
    }

    .panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-control {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-color);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-submit:active {
      background: var(--accent-hover);
    }

    .btn-submit:disabled {
      background: var(--border-color);
      cursor: not-allowed;
    }

    .alert-box {
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success-color);
      color: #6ee7b7;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger-color);
      color: #fca5a5;
    }

    .list-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item .item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .list-item .item-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat-card {
      background: var(--bg-color);
      padding: 12px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Style cho hiển thị ảnh đính kèm */
    .evidence-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ScamCheck Bot</h1>
    <p>Hệ thống tra cứu & Cảnh báo lừa đảo tự động</p>
  </div>

  <div class="grid-menu">
    <div class="menu-card" onclick="openPanel('panel-check')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Kiểm tra Scam</span>
    </div>

    <div class="menu-card" onclick="openPanel('panel-report')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span>Gửi Báo Cáo</span>
    </div>

    <div class="menu-card" onclick="openPanel('panel-recent')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      <span>Báo Cáo Gần Đây</span>
    </div>

    <div class="menu-card" onclick="openPanel('panel-stats')">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Thống Kê Chung</span>
    </div>
  </div>

  <!-- Panel 1: Tra cứu -->
  <div id="panel-check" class="panel">
    <div class="panel-title">
      <span>Tra cứu thông tin</span>
      <button class="btn-close" onclick="closePanel('panel-check')">Đóng [x]</button>
    </div>
    <div class="form-group">
      <label>SĐT / STK / Link / Social / Tên</label>
      <input type="text" id="check-input" class="form-control" placeholder="Nhập thông tin cần tra..." />
    </div>
    <button class="btn-submit" onclick="executeCheck()">Tra Cứu Ngay</button>
    <div id="check-result" style="margin-top: 14px;"></div>
  </div>

  <!-- Panel 2: Báo cáo -->
  <div id="panel-report" class="panel">
    <div class="panel-title">
      <span>Tạo báo cáo lừa đảo</span>
      <button class="btn-close" onclick="closePanel('panel-report')">Đóng [x]</button>
    </div>
    <div class="form-group">
      <label>Loại đối tượng</label>
      <select id="report-type" class="form-control">
        <option value="phone">Số điện thoại</option>
        <option value="bank">Tài khoản ngân hàng</option>
        <option value="link">Đường dẫn Website</option>
        <option value="social">Tài khoản Social (TikTok/Tele/Zalo/YT)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Thông tin đối tượng</label>
      <input type="text" id="report-value" class="form-control" placeholder="Ví dụ: 0xxxxx111" />
    </div>
    <div class="form-group">
      <label>Chi tiết hành vi</label>
      <textarea id="report-desc" class="form-control" placeholder="Mô tả lại sự việc lừa đảo..."></textarea>
    </div>
    <div class="form-group">
      <label>Ảnh bằng chứng (Tùy chọn)</label>
      <input type="file" id="report-image" class="form-control" accept="image/*" />
    </div>
    <button class="btn-submit" id="btn-submit-report" onclick="submitReport()">Gửi Báo Cáo</button>
  </div>

  <!-- Panel 3: Báo cáo gần đây -->
  <div id="panel-recent" class="panel">
    <div class="panel-title">
      <span>Báo cáo mới cập nhật</span>
      <button class="btn-close" onclick="closePanel('panel-recent')">Đóng [x]</button>
    </div>
    <div id="recent-list">
      <div class="alert-box alert-success">Đang tải dữ liệu từ CSDL...</div>
    </div>
  </div>

  <!-- Panel 4: Thống kê -->
  <div id="panel-stats" class="panel">
    <div class="panel-title">
      <span>Thống kê hệ thống</span>
      <button class="btn-close" onclick="closePanel('panel-stats')">Đóng [x]</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-blacklist">--</div>
        <div class="stat-label">Blacklist</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-reports">--</div>
        <div class="stat-label">Báo Cáo</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-checks">--</div>
        <div class="stat-label">Lượt Tra</div>
      </div>
    </div>
  </div>

  <!-- FIREBASE WEB SDK INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      where, 
      getDocs, 
      addDoc, 
      getCountFromServer, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
      authDomain: "quocdat-396fe.firebaseapp.com",
      databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quocdat-396fe",
      storageBucket: "quocdat-396fe.firebasestorage.app",
      messagingSenderId: "685476439350",
      appId: "1:685476439350:web:949054ecba7f0a0c383f97"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    window.openPanel = function(panelId) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');

      if (panelId === 'panel-stats') fetchRealStats();
      if (panelId === 'panel-recent') fetchRecentScams();
    };

    window.closePanel = function(panelId) {
      document.getElementById(panelId).classList.remove('active');
    };

    // 1. Tra cứu realtime & hiển thị ảnh đính kèm
    window.executeCheck = async function() {
      const input = document.getElementById('check-input').value.trim().toLowerCase();
      const resultDiv = document.getElementById('check-result');

      if (!input) {
        resultDiv.innerHTML = `<div class="alert-box alert-danger">Vui lòng nhập thông tin cần tra cứu.</div>`;
        return;
      }

      resultDiv.innerHTML = `<div class="alert-box alert-success">Đang truy vấn CSDL...</div>`;

      try {
        const cleanVal = input.replace(/^@/, '');
        const q = query(
          collection(db, "blacklist"), 
          where("value", "in", [cleanVal, `@${cleanVal}`, input])
        );
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          const docData = querySnapshot.docs[0].data();
          let imgHtml = docData.image_url 
            ? `<a href="${docData.image_url}" target="_blank"><img src="${docData.image_url}" class="evidence-img" alt="Bằng chứng scam" /></a>` 
            : '';

          resultDiv.innerHTML = `
            <div class="alert-box alert-danger">
              <b>CẢNH BÁO LỪA ĐẢO!</b><br/>
              Đối tượng: <b>${docData.value}</b><br/>
              Số lượt báo cáo: ${docData.report_count || 1}<br/>
              Chi tiết: ${docData.description || 'Không có mô tả'}
              ${imgHtml}
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="alert-box alert-success">
              <b>CHƯA GHI NHẬN LỪA ĐẢO</b><br/>
              Dữ liệu <b>${input}</b> chưa có trong CSDL đen. Hãy luôn cẩn trọng khi giao dịch!
            </div>
          `;
        }

        await addDoc(collection(db, "checks_log"), {
          user_id: tg?.initDataUnsafe?.user?.id || 'web_user',
          query_value: input,
          timestamp: serverTimestamp()
        });

      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<div class="alert-box alert-danger">Lỗi kết nối CSDL Firebase.</div>`;
      }
    };

    // 2. Gửi Báo Cáo + Tải ảnh bằng chứng
    window.submitReport = async function() {
      const type = document.getElementById('report-type').value;
      const val = document.getElementById('report-value').value.trim();
      const desc = document.getElementById('report-desc').value.trim();
      const fileInput = document.getElementById('report-image');
      const submitBtn = document.getElementById('btn-submit-report');

      if (!val || !desc) {
        alert('Vui lòng nhập đầy đủ thông tin báo cáo.');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerText = 'Đang tải ảnh & gửi báo cáo...';

        let imageUrl = '';
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileRef = ref(storage, `reports/${Date.now()}_${file.name}`);
          const uploadResult = await uploadBytes(fileRef, file);
          imageUrl = await getDownloadURL(uploadResult.ref);
        }

        await addDoc(collection(db, "reports"), {
          type: type,
          value: val.toLowerCase(),
          description: desc,
          image_url: imageUrl,
          submitted_by: String(tg?.initDataUnsafe?.user?.id || 'web_user'),
          status: 'pending',
          created_at: serverTimestamp()
        });

        alert('Đã gửi báo cáo thành công! Báo cáo đang chờ Admin phê duyệt.');
        document.getElementById('report-value').value = '';
        document.getElementById('report-desc').value = '';
        fileInput.value = '';
        closePanel('panel-report');
      } catch (err) {
        alert('Lỗi khi gửi báo cáo: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Gửi Báo Cáo';
      }
    };

    // 3. Đếm thống kê
    async function fetchRealStats() {
      try {
        const blSnap = await getCountFromServer(collection(db, "blacklist"));
        const repSnap = await getCountFromServer(collection(db, "reports"));
        const chkSnap = await getCountFromServer(collection(db, "checks_log"));

        document.getElementById('stat-blacklist').innerText = blSnap.data().count.toLocaleString();
        document.getElementById('stat-reports').innerText = repSnap.data().count.toLocaleString();
        document.getElementById('stat-checks').innerText = chkSnap.data().count.toLocaleString();
      } catch (err) {
        console.error('Lỗi lấy thống kê:', err);
      }
    }

    // 4. Lấy danh sách Scam mới nhất kèm ảnh
    async function fetchRecentScams() {
      const recentList = document.getElementById('recent-list');
      try {
        const q = query(collection(db, "blacklist"), orderBy("createdAt", "desc"), limit(5));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          recentList.innerHTML = `<div class="alert-box alert-success">Chưa có báo cáo nào gần đây.</div>`;
          return;
        }

        let html = '';
        snapshot.forEach(doc => {
          const item = doc.data();
          let imgHtml = item.image_url 
            ? `<a href="${item.image_url}" target="_blank"><img src="${item.image_url}" class="evidence-img" alt="Bằng chứng" /></a>` 
            : '';

          html += `
            <div class="list-item">
              <div class="item-title">[${(item.type || 'SCAM').toUpperCase()}] ${item.value}</div>
              <div class="item-sub">${item.description || 'Không có chi tiết'}</div>
              ${imgHtml}
            </div>
          `;
        });
        recentList.innerHTML = html;
      } catch (err) {
        recentList.innerHTML = `<div class="alert-box alert-danger">Không thể tải dữ liệu gần đây.</div>`;
      }
    }
  </script>
</body>
</html>
