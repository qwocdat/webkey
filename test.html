<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple iOS 26 - Apple Liquid Glass Engine</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.25)',
                            dark: 'rgba(18, 18, 22, 0.45)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* ==========================================================================
           RESET & ABSOLUTE NO FAKE HIGHLIGHT / FOCUS OUTLINE (MỤC TIÊU TỐI THƯỢNG)
           ========================================================================== */
        *, *::before, *::after {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            user-select: none !important;
            outline: none !important;
        }

        :focus, :focus-visible, :active {
            outline: none !important;
            box-shadow: none !important;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #f3f4f6;
            transition: background-color 0.5s ease;
        }

        body.dark {
            background-color: #0d0e12;
        }

        /* ==========================================================================
           7-LAYER RENDERING PIPELINE & CORE LIQUID GLASS MATERIAL
           ========================================================================== */
        
        .liquid-glass-node {
            position: relative;
            isolation: isolate;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-radius: inherit;
        }

        /* Layer 3: True Refraction & Volumetric Distortion (SVG Displacement Filter) */
        .glass-refraction-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: inherit;
            filter: url('#liquid-glass-refraction-filter') blur(12px) contrast(105%) saturate(125%);
            background: inherit;
            opacity: 0.98;
            pointer-events: none;
        }

        /* Layer 4: Glass Surface Volume & Material Tint */
        .glass-surface-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
            mix-blend-mode: overlay;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        .dark .glass-surface-layer {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(0, 0, 0, 0.35) 100%);
        }

        /* Layer 5: Dynamic Ray-Traced Canvas Overlay */
        .glass-specular-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            border-radius: inherit;
            pointer-events: none;
        }

        /* Layer 6: Multi-Layer Edge Lighting & Edge Chromatic Optics */
        .glass-edge-layer {
            position: absolute;
            inset: 0;
            z-index: 4;
            border-radius: inherit;
            pointer-events: none;
            /* Triple Layer Border Architecture: Outer Soft Shadow + Bright Cut Edge + Inner Reflective Inset */
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.5) inset,
                0 1px 2px 0 rgba(255, 255, 255, 0.8) inset,
                0 -1px 2px 0 rgba(0, 0, 0, 0.1) inset,
                0 20px 40px -15px rgba(0, 0, 0, 0.07);
        }

        .dark .glass-edge-layer {
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.15) inset,
                0 1px 1px 0 rgba(255, 255, 255, 0.3) inset,
                0 -1px 2px 0 rgba(0, 0, 0, 0.5) inset,
                0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        /* Layer 7: Interaction & Physical Content Buffer */
        .glass-content-layer {
            position: relative;
            z-index: 5;
            border-radius: inherit;
        }

        /* VOLUMETRIC COMPRESSION ON PRESS (Spring Physics Feeling) */
        .liquid-glass-node:active {
            transform: scale(0.975) translateY(1px);
        }

        /* Custom Scrollbar suppression */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen relative antialiased selection:bg-none">

    <!-- ==========================================================================
         SVG FILTER PIPELINE: TRUE OPTICAL REFRACTION & CHROMATIC ABERRATION

    <svg class="hidden absolute width-0 height-0" aria-hidden="true">
        <defs>
            <filter id="liquid-glass-refraction-filter" x="-20%" y="-20%" width="140%" height="140%">
                <!-- Dynamic Liquid Ripples Turbulence Generator -->
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" id="fe-turbulence" />
                <feGaussianBlur in="noise" stdDeviation="4" result="blurredNoise" />
                <!-- Physical Lens Bulge Displacement Mapping -->
                <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="22" xChannelSelector="R" yChannelSelector="G" result="displaced" />
                <!-- Subtle Saturation Amplification through refractive medium -->
                <feColorMatrix type="saturate" values="1.3" in="displaced" />
            </filter>
        </defs>
    </svg>

    <!-- ==========================================================================
         GLOBAL LIQUID GLASS ENGINE & DYNAMIC LIGHTING SCRIPT
         ========================================================================== -->
    <script>
        /**
         * Global Liquid Glass Engine
         * Ray-traces real-time light vectors and computes dynamic specular highlights,
         * multi-layer edge light concentration, and fluid interaction physics.
         */
        class LiquidGlassEngine {
            constructor() {
                this.nodes = [];
                this.pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, targetX: window.innerWidth / 2, targetY: window.innerHeight / 2 };
                this.config = {
                    refractionIOR: 1.45,
                    specularIntensity: 0.9,
                    lightFollowSpeed: 0.12
                };

                this.init();
            }

            init() {
                this.bindEvents();
                this.registerNodes();
                this.renderLoop();
            }

            registerNodes() {
                const elements = document.querySelectorAll('.liquid-glass-node');
                elements.forEach(el => {
                    const canvas = el.querySelector('.glass-specular-canvas');
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        const thickness = parseFloat(el.getAttribute('data-thickness') || '0.8');
                        this.nodes.push({ el, canvas, ctx, thickness });
                    }
                });
            }

            bindEvents() {
                const updatePointer = (x, y) => {
                    this.pointer.targetX = x;
                    this.pointer.targetY = y;
                };

                window.addEventListener('pointermove', (e) => updatePointer(e.clientX, e.clientY));
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        updatePointer(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: true });

                window.addEventListener('resize', () => {
                    this.nodes.forEach(node => this.resizeCanvas(node));
                });
            }

            resizeCanvas(node) {
                const rect = node.el.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                node.canvas.width = rect.width * dpr;
                node.canvas.height = rect.height * dpr;
                node.ctx.scale(dpr, dpr);
            }

            renderLoop() {
                // Spring physics lag algorithm for smooth volumetric light motion
                this.pointer.x += (this.pointer.targetX - this.pointer.x) * this.config.lightFollowSpeed;
                this.pointer.y += (this.pointer.targetY - this.pointer.y) * this.config.lightFollowSpeed;

                // Animate background light blobs based on pointer offset
                const blob1 = document.getElementById('blob-1');
                const blob2 = document.getElementById('blob-2');
                if(blob1 && blob2) {
                    const offsetX = (this.pointer.x - window.innerWidth / 2) * 0.05;
                    const offsetY = (this.pointer.y - window.innerHeight / 2) * 0.05;
                    blob1.style.transform = `translate(${offsetX - 50}%, ${offsetY - 50}%)`;
                    blob2.style.transform = `translate(${-offsetX}px, ${-offsetY}px)`;
                }

                // Render dynamic specular raytracing on each registered glass node
                this.nodes.forEach(node => {
                    const rect = node.el.getBoundingClientRect();
                    
                    // Auto-sync canvas size if bounding box shifts
                    if (node.canvas.width !== Math.floor(rect.width * (window.devicePixelRatio || 1))) {
                        this.resizeCanvas(node);
                    }

                    const ctx = node.ctx;
                    const w = rect.width;
                    const h = rect.height;

                    ctx.clearRect(0, 0, w, h);

                    // Compute relative light vector to node center
                    const relX = this.pointer.x - rect.left;
                    const relY = this.pointer.y - rect.top;

                    // 1. Dynamic Specular Reflection Point
                    const specGradient = ctx.createRadialGradient(
                        relX, relY, 0,
                        relX, relY, Math.max(w, h) * 0.8
                    );
                    
                    const isDark = document.documentElement.classList.contains('dark');
                    const specularAlpha = node.thickness * (isDark ? 0.35 : 0.6);

                    specGradient.addColorStop(0, `rgba(255, 255, 255, ${specularAlpha})`);
                    specGradient.addColorStop(0.2, `rgba(255, 255, 255, ${specularAlpha * 0.4})`);
                    specGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.fillStyle = specGradient;
                    ctx.fillRect(0, 0, w, h);

                    // 2. Directional Edge Lighting (Light-Facing Rim Highlight)
                    const angle = Math.atan2(relY - h / 2, relX - w / 2);
                    const edgeX = w / 2 + (Math.cos(angle) * w) / 2;
                    const edgeY = h / 2 + (Math.sin(angle) * h) / 2;

                    const edgeGradient = ctx.createRadialGradient(
                        edgeX, edgeY, 0,
                        edgeX, edgeY, Math.min(w, h) * 0.5
                    );

                    edgeGradient.addColorStop(0, `rgba(255, 255, 255, ${node.thickness * 0.5})`);
                    edgeGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.fillStyle = edgeGradient;
                    ctx.fillRect(0, 0, w, h);
                });

                requestAnimationFrame(() => this.renderLoop());
            }
        }

        // Initialize Engine & Application Controllers when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            const engine = new LiquidGlassEngine();

            // 1. Theme Switcher (Dark/Light Mode)
            const themeToggle = document.getElementById('theme-toggle');
            const toggleOrb = document.getElementById('toggle-orb');
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');

            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                if (isDark) {
                    toggleOrb.style.transform = 'translateX(24px)';
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                } else {
                    toggleOrb.style.transform = 'translateX(0px)';
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                }
            });

            // 2. Tab Bar Spring Physics Capsule
            const tabItems = document.querySelectorAll('.tab-item');
            const tabIndicator = document.getElementById('tab-indicator');

            tabItems.forEach((tab, index) => {
                tab.addEventListener('click', () => {
                    tabItems.forEach(t => t.classList.replace('text-gray-900', 'text-gray-500'));
                    tabItems.forEach(t => t.classList.replace('dark:text-white', 'dark:text-gray-400'));
                    
                    tab.classList.replace('text-gray-500', 'text-gray-900');
                    tab.classList.replace('dark:text-gray-400', 'dark:text-white');

                    const width = tab.offsetWidth;
                    const left = tab.offsetLeft;

                    tabIndicator.style.width = `${width}px`;
                    tabIndicator.style.transform = `translateX(${left - 8}px)`;
                });
            });

            // 3. Interactive Glass Volume Slider
            const sliderRail = document.getElementById('slider-rail');
            const sliderFill = document.getElementById('slider-fill');
            const sliderVal = document.getElementById('slider-val');
            let isDragging = false;

            const updateSlider = (clientX) => {
                const rect = sliderRail.getBoundingClientRect();
                let percentage = ((clientX - rect.left) / rect.width) * 100;
                percentage = Math.max(5, Math.min(100, percentage));
                sliderFill.style.width = `${percentage}%`;
                sliderVal.textContent = `${Math.round(percentage)}%`;
            };

            sliderRail.addEventListener('pointerdown', (e) => {
                isDragging = true;
                updateSlider(e.clientX);
            });

            window.addEventListener('pointermove', (e) => {
                if (isDragging) updateSlider(e.clientX);
            });

            window.addEventListener('pointerup', () => isDragging = false);

            // 4. Music Play/Pause Orb Interaction
            const playOrb = document.getElementById('play-orb');
            const playIcon = document.getElementById('play-icon');
            let isPlaying = false;

            playOrb.addEventListener('click', () => {
                isPlaying = !isPlaying;
                if (isPlaying) {
                    playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
                    playOrb.classList.add('ring-4', 'ring-pink-500/30');
                } else {
                    playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
                    playOrb.classList.remove('ring-4', 'ring-pink-500/30');
                }
            });
        });
    </script>
</body>
</html>
